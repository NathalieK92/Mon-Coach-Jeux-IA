```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon Coach de Jeux IA - Backgammon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3eadb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #5b321d;
    }

    .plateau {
      width: min(950px, 100%);
      margin: 25px auto;
      padding: 12px;
      background: #663c27;
      border: 5px solid #3c2419;
      border-radius: 10px;
      box-shadow: 0 8px 20px #0003;
    }

    .interieur {
      display: grid;
      grid-template-columns: repeat(13, minmax(0, 1fr));
      grid-template-rows: 1fr 1fr;
      min-height: 420px;
      background: #e9d0a7;
      border: 2px solid #3c2419;
    }

    .case {
      display: flex;
      justify-content: center;
      overflow: hidden;
      min-width: 0;
      background: #e9d0a7;
    }

    .haut {
      align-items: flex-start;
    }

    .bas {
      align-items: flex-end;
    }

    .triangle {
      width: 100%;
      height: 85%;
      flex-shrink: 0;
    }

    .haut .triangle {
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .bas .triangle {
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .brun {
      background: #8b4d2e;
    }

    .creme {
      background: #fff0cf;
    }

    .barre {
      grid-column: 7;
      grid-row: 1 / 3;
      background: #4b2b1d;
      border-left: 3px solid #3c2419;
      border-right: 3px solid #3c2419;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .plateau {
        padding: 5px;
      }

      .interieur {
        min-height: 280px;
      }

      .triangle {
        height: 80%;
      }
    }
  </style>
</head>

<body>
  <h1>Mon Coach de Jeux IA</h1>
  <h2>Plateau de backgammon</h2>

  <div class="plateau">
    <div class="interieur" id="plateau"></div>
  </div>

  <p>24 triangles · 4 groupes de 6 · Couleurs alternées</p>

  <script>
    const plateau = document.getElementById("plateau");

    // La barre centrale occupe la 7e colonne.
    // Les 12 triangles de chaque rangée sont répartis
    // en deux groupes de 6.

    for (let ligne = 0; ligne < 2; ligne++) {
      for (let colonne = 0; colonne < 13; colonne++) {

        if (colonne === 6) {
          if (ligne === 0) {
            const barre = document.createElement("div");
            barre.className = "barre";
            plateau.appendChild(barre);
          }
          continue;
        }

        const casePlateau = document.createElement("div");
        casePlateau.className =
          ligne === 0 ? "case haut" : "case bas";

        const triangle = document.createElement("div");

        // COULEURS INVERSÉES :
        // premier triangle crème, puis brun, en alternance.
        const indexTriangle = colonne < 6 ? colonne : colonne - 1;
        const estCreme = (indexTriangle + ligne) % 2 === 0;

        triangle.className =
          "triangle " + (estCreme ? "creme" : "brun");

        casePlateau.appendChild(triangle);
        plateau.appendChild(casePlateau);
      }
    }
  </script>
</body>
</html>
