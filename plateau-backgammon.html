
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Coach de Jeux IA - Backgammon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4eadb;
      color: #382417;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      margin-bottom: 20px;
    }

    .plateau {
      width: min(100%, 900px);
      margin: 20px auto;
      padding: 12px;
      background: #704323;
      border: 5px solid #382417;
      border-radius: 12px;
      display: grid;
      grid-template-columns: 1fr 34px 1fr;
      gap: 5px;
      box-shadow: 0 6px 15px #0003;
    }

    .demi {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: 180px 180px;
      min-width: 0;
      background: #e7c99b;
    }

    .case {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      overflow: hidden;
      background: #e7c99b;
    }

    .case:nth-child(even) {
      background: #b86d43;
    }

    .triangle {
      width: 0;
      height: 0;
      flex-shrink: 0;
      border-left: clamp(8px, 1.8vw, 25px) solid transparent;
      border-right: clamp(8px, 1.8vw, 25px) solid transparent;
    }

    /* Rangée du haut : pointe dirigée vers le bas */
    .haut .triangle {
      border-top: 0;
      border-bottom: 145px solid #704323;
    }

    .haut .case:nth-child(even) .triangle {
      border-bottom-color: #f0d7ad;
    }

    /* Rangée du bas : pointe dirigée vers le haut */
    .bas .case {
      justify-content: flex-end;
    }

    .bas .triangle {
      order: 2;
      border-bottom: 0;
      border-top: 145px solid #704323;
    }

    .bas .case:nth-child(even) .triangle {
      border-top-color: #f0d7ad;
    }

    .pions {
      position: absolute;
      z-index: 2;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }

    .haut .pions {
      top: 2px;
    }

    .bas .pions {
      bottom: 2px;
      flex-direction: column-reverse;
    }

    .pion {
      width: clamp(15px, 2.2vw, 25px);
      height: clamp(15px, 2.2vw, 25px);
      border-radius: 50%;
      border: 2px solid #382417;
      box-shadow: 0 1px 2px #0006;
    }

    .blanc {
      background: #fff8e9;
    }

    .noir {
      background: #252525;
      border-color: #111;
    }

    .barre {
      grid-column: 2;
      grid-row: 1 / 3;
      background: #382417;
      border-left: 2px solid #9b704b;
      border-right: 2px solid #9b704b;
    }

    .commandes {
      margin: 20px auto;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #704323;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #4e2c17;
    }

    #des {
      margin-top: 15px;
      font-size: 28px;
      font-weight: bold;
      min-height: 38px;
    }

    .retour {
      display: inline-block;
      margin-top: 15px;
      color: #704323;
    }

    @media (max-width: 560px) {
      body {
        padding: 8px;
      }

      .plateau {
        padding: 5px;
        gap: 3px;
        border-width: 3px;
      }

      .demi {
        grid-template-rows: 125px 125px;
      }

      .haut .triangle {
        border-bottom-width: 100px;
      }

      .bas .triangle {
        border-top-width: 100px;
      }
    }
  </style>
</head>

<body>
  <h1>Mon Coach de Jeux IA</h1>
  <p>Découvre le plateau de backgammon et lance les dés !</p>

  <div class="plateau">
    <div class="demi haut" id="haut-gauche"></div>
    <div class="barre"></div>
    <div class="demi haut" id="haut-droite"></div>
    <div class="demi bas" id="bas-gauche"></div>
    <div class="barre"></div>
    <div class="demi bas" id="bas-droite"></div>
  </div>

  <div class="commandes">
    <button onclick="lancerDes()">🎲 Lancer les dés</button>
    <div id="des">⚀ ⚀</div>
  </div>

  <a class="retour" href="index.html">← Retour à l'accueil</a>

  <script>
    function creerCase(zone, numero, couleurPion = null, nombrePions = 0) {
      const caseElement = document.createElement("div");
      caseElement.className = "case";
      caseElement.setAttribute("aria-label", "Case " + numero);

      const triangle = document.createElement("div");
      triangle.className = "triangle";
      caseElement.appendChild(triangle);

      if (nombrePions > 0) {
        const pions = document.createElement("div");
        pions.className = "pions";

        for (let i = 0; i < nombrePions; i++) {
          const pion = document.createElement("div");
          pion.className = "pion " + couleurPion;
          pions.appendChild(pion);
        }

        caseElement.appendChild(pions);
      }

      zone.appendChild(caseElement);
    }

    function creerPlateau() {
      const zones = [
        document.getElementById("haut-gauche"),
        document.getElementById("haut-droite"),
        document.getElementById("bas-gauche"),
        document.getElementById("bas-droite")
      ];

      zones.forEach(zone => zone.innerHTML = "");

      /* Six cases dans chaque zone : 24 cases au total */
      zones.forEach((zone, indexZone) => {
        for (let i = 0; i < 6; i++) {
          let couleur = null;
          let nombre = 0;

          /* Quelques pions pour illustrer le plateau */
          if (indexZone === 0 && i === 0) {
            couleur = "blanc";
            nombre = 2;
          }

          if (indexZone === 1 && i === 5) {
            couleur = "noir";
            nombre = 3;
          }

          if (indexZone === 2 && i === 5) {
            couleur = "blanc";
            nombre = 3;
          }

          if (indexZone === 3 && i === 0) {
            couleur = "noir";
            nombre = 2;
          }

          creerCase(zone, indexZone * 6 + i + 1, couleur, nombre);
        }
      });
    }

    function lancerDes() {
      const de1 = Math.floor(Math.random() * 6) + 1;
      const de2 = Math.floor(Math.random() * 6) + 1;

      const faces = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];

      document.getElementById("des").textContent =
        faces[de1 - 1] + " " + faces[de2 - 1] +
        "  (" + de1 + " et " + de2 + ")";
    }

    creerPlateau();
  </script>
</body>
</html>
