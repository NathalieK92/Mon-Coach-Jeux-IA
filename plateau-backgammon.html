```html
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Coach de Jeux IA - Backgammon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3eadb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #5b321d;
    }

    .plateau {
      width: min(950px, 100%);
      margin: 25px auto;
      padding: 14px;
      background: #663c27;
      border: 5px solid #3c2419;
      border-radius: 12px;
      box-shadow: 0 8px 20px #0003;
    }

    .interieur {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: 1fr 1fr;
      gap: 0;
      min-height: 400px;
      background: #e9d0a7;
      border: 3px solid #3c2419;
    }

    .case {
      position: relative;
      display: flex;
      justify-content: center;
      overflow: hidden;
      background: #e9d0a7;
    }

    .case.haut {
      align-items: flex-start;
    }

    .case.bas {
      align-items: flex-end;
    }

    .triangle {
      width: 100%;
      height: 85%;
      flex-shrink: 0;
    }

    .haut .triangle {
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .bas .triangle {
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .brun {
      background: #8b4d2e;
    }

    .creme {
      background: #fff0cf;
    }

    .barre {
      grid-column: 7 / 8;
      grid-row: 1 / 3;
      grid-column: 7;
      background: #4b2b1d;
      border-left: 3px solid #3c2419;
      border-right: 3px solid #3c2419;
      z-index: 2;
    }

    .interieur {
      position: relative;
    }

    .rang {
      display: contents;
    }

    .milieu {
      height: 0;
    }

    .infos {
      color: #5b321d;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .plateau {
        padding: 6px;
      }

      .interieur {
        min-height: 260px;
      }

      .triangle {
        height: 78%;
      }
    }
  </style>
</head>

<body>
  <h1>Mon Coach de Jeux IA</h1>
  <h2>Plateau de backgammon</h2>

  <div class="plateau">
    <div class="interieur" id="plateau"></div>
  </div>

  <p class="infos">
    24 triangles · 4 groupes de 6 · Couleurs alternées
  </p>

  <script>
    const plateau = document.getElementById("plateau");

    // Six triangles dans chacun des quatre groupes.
    // La barre centrale occupe l'espace entre les deux moitiés.
    for (let ligne = 0; ligne < 2; ligne++) {
      for (let colonne = 0; colonne < 12; colonne++) {
        const casePlateau = document.createElement("div");
        casePlateau.className = ligne === 0 ? "case haut" : "case bas";

        // L'espace central sépare les deux groupes de six.
        if (colonne === 6) {
          casePlateau.style.borderLeft = "8px solid #4b2b1d";
        }

        const triangle = document.createElement("div");
        triangle.className =
          "triangle " + ((colonne + ligne) % 2 === 0 ? "brun" : "creme");

        casePlateau.appendChild(triangle);
        plateau.appendChild(casePlateau);
      }
    }
  </script>
</body>
</html>
