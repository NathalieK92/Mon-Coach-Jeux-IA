<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Coach de Jeux IA - Backgammon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3eadb;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      color: #5b321d;
    }

    h2 {
      color: #663c27;
    }

    .plateau {
      width: min(950px, 100%);
      margin: 25px auto;
      padding: 12px;
      background: #663c27;
      border: 5px solid #3c2419;
      border-radius: 10px;
      box-shadow: 0 8px 20px #0003;
    }

    .interieur {
      display: grid;
      grid-template-columns: repeat(13, minmax(0, 1fr));
      grid-template-rows: 1fr 1fr;
      min-height: 420px;
      background: #e9d0a7;
      border: 2px solid #3c2419;
    }

    .case {
      min-width: 0;
      display: flex;
      justify-content: center;
      overflow: hidden;
      background: #e9d0a7;
    }

    .haut {
      align-items: flex-start;
    }

    .bas {
      align-items: flex-end;
    }

    .triangle {
      width: 100%;
      height: 85%;
      flex-shrink: 0;
    }

    .haut .triangle {
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    .bas .triangle {
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
    }

    .brun {
      background-color: #8b4d2e;
    }

    .creme {
      background-color: #fff0cf;
    }

    .barre {
      grid-column: 7;
      grid-row: 1 / 3;
      background-color: #4b2b1d;
      border-left: 3px solid #3c2419;
      border-right: 3px solid #3c2419;
    }

    .infos {
      color: #5b321d;
      font-size: 16px;
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .plateau {
        padding: 5px;
      }

      .interieur {
        min-height: 280px;
      }

      .triangle {
        height: 80%;
      }
    }
  </style>
</head
