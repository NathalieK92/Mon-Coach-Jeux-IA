<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateau de backgammon</title>
<style>
  :root {
    --frame: #4a3426;      /* bois du cadre */
    --frame-dark: #35241a;
    --field: #b86f45;      /* fond marron du plateau */
    --cream: #f6efe2;      /* triangles crème */
    --brown: #2b1d17;      /* triangles marron foncé */
    --tray: #7a5238;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #ece7df;
    padding: 20px;
  }

  /* Cadre extérieur */
  .board {
    display: flex;
    width: min(96vw, 1000px);
    aspect-ratio: 1.45 / 1;
    padding: 2.2%;
    background: linear-gradient(135deg, var(--frame), var(--frame-dark));
    border-radius: 6px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
    gap: 1.2%;
  }

  /* Une moitié du plateau */
  .half {
    flex: 1;
    display: flex;
    gap: 3%;
    padding: 2.5%;
    background: var(--field);
    background-image:

      radial-gradient(rgba(0,0,0,.08) 1px, transparent 1px);
