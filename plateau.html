<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Coach de Jeux IA - Backgammon</title>
<style>
:root{
  --frame:#4a3426;--dark:#35241a;--field:#b86f45;
  --cream:#f6efe2;--gold:#ffd54a;
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;background:#ece7df;color:#35241a;
  font-family:system-ui,Arial,sans-serif;text-align:center
}
h1{font-size:clamp(22px,4vw,34px);margin:5px 0 15px}
#status{
  display:inline-block;padding:10px 22px;border-radius:30px;
  font-size:18px;font-weight:800;margin:6px auto 12px;
  border:3px solid transparent;transition:all .25s
}
#status.white-turn{
  background:#fff;color:#30251e;border-color:#d1b878;
  box-shadow:0 0 12px #fff,0 0 25px #e7c95b;
  animation:flashWhite 1.1s ease-in-out infinite alternate
}
#status.black-turn{
  background:#29221e;color:#fff;border-color:#d7a65c;
  box-shadow:0 0 12px #5c4638,0 0 24px #c28c4a;
  animation:flashBlack 1.1s ease-in-out infinite alternate
}
#status.finished{background:#e7d7a0;color:#35241a}
@keyframes flashWhite{
  from{box-shadow:0 0 5px #fff,0 0 10px #e7c95b}
  to{box-shadow:0 0 18px #fff,0 0 30px #e7c95b}
}
@keyframes flashBlack{
  from{box-shadow:0 0 5px #8a6548,0 0 10px #d7a65c}
  to{box-shadow:0 0 18px #8a6548,0 0 30px #d7a65c}
}
#help{font-size:14px;min-height:24px;margin:8px}
.game-layout{
  display:flex;align-items:stretch;justify-content:center;
  gap:12px;width:min(98vw,1100px);margin:12px auto
}
.board{
  flex:1;min-width:0;padding:10px;display:flex;gap:7px;
  aspect-ratio:1.5/1;background:linear-gradient(135deg,#68472f,#35241a);
  border:4px solid var(--dark);border-radius:10px;
  box-shadow:0 12px 28px #0004
}
.half{flex:1;min-width:0;display:flex;gap:4px;padding:5px;background:var(--field)}
.quarters{flex:1;min-width:0;display:grid;grid-template-rows:1fr 1fr;gap:7px}
.row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));min-height:0}
.point{
  position:relative;min-width:0;display:flex;flex-direction:column;
  align-items:center;cursor:pointer
}
.row.bottom .point{flex-direction:column-reverse}
.tri{position:absolute;inset:0 1px;background:var(--cream);pointer-events:none}
.row.top .tri{clip-path:polygon(0 0,100% 0,50% 100%)}
.row.bottom .tri{clip-path:polygon(50% 0,100% 100%,0 100%)}
.row.top .point:nth-child(even) .tri,
.row.bottom .point:nth-child(odd) .tri{background:#35241a}
.point.legal .tri{filter:brightness(1.4)}
.point.selected{outline:3px solid var(--gold);outline-offset:-3px}
.point.selected .tri{filter:brightness(1.5)}
.checker{
  z-index:2;position:relative;width:85%;max-width:45px;aspect-ratio:1;
  flex-shrink:0;border-radius:50%;margin-bottom:-8%;
  border:2px solid #0005;box-shadow:0 2px 3px #0008;pointer-events:none
}
.row.bottom .checker{margin-bottom:0;margin-top:-8%}
.checker.white{background:radial-gradient(circle at 32% 25%,#fff,#e1d2b5)}
.checker.black{background:radial-gradient(circle at 32% 25%,#786050,#1b110c)}
.num{
  position:absolute;z-index:3;font-size:clamp(8px,1.2vw,12px);
  font-weight:700;color:white;text-shadow:0 1px 3px #000;pointer-events:none
}
.row.top .num{top:2px}.row.bottom .num{bottom:2px}
.bar{
  width:8%;min-width:32px;background:var(--dark);border-radius:4px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:space-around;padding:5px 2px;gap:5px
}
.bar #barW,.bar #barB{
  width:100%;min-height:35px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;cursor:pointer
}
.bar .selected{outline:2px solid var(--gold);background:#ffffff18}
.bar .checker{width:85%;max-width:38px;min-width:18px;margin:0;pointer-events:auto}
.bar-count{color:white;font-size:12px;font-weight:bold;pointer-events:none}
.bar-label{color:white;font-size:11px;font-weight:bold}
.tray{
  width:8%;min-width:17px;background:#795136;border-radius:3px;
  display:flex;flex-direction:column;align-items:center;
  justify-content:space-around;color:white;font-size:11px;font-weight:bold
}

/* Panneau de dés animé sur le côté */
.dice-panel{
  width:105px;flex-shrink:0;border-radius:10px;padding:12px 8px;
  background:linear-gradient(160deg,#fffdf8,#ded2bd);
  border:2px solid #b99a6d;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;
  box-shadow:0 5px 15px #0002
}
.dice-title{font-size:13px;font-weight:800}
.dice-pair{display:flex;flex-direction:column;gap:14px;align-items:center}
.die{
  width:55px;height:55px;border-radius:10px;background:#fff;
  border:2px solid #39271c;box-shadow:0 4px 7px #0003;
  display:grid;place-items:center;font-size:39px;line-height:1;
  color:#29221e;user-select:none
}
.die.rolling{animation:rollDie .16s linear infinite}
@keyframes rollDie{
  0%{transform:rotate(0deg) scale(1)}
  25%{transform:rotate(12deg) scale(.88)}
  50%{transform:rotate(90deg) scale(1.08)}
  75%{transform:rotate(190deg) scale(.9)}
  100%{transform:rotate(360deg) scale(1)}
}
.dice-panel.rolling{box-shadow:0 0 18px #d4a94c}
.controls{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:10px;margin:14px auto
}
button{
  border:0;border-radius:7px;padding:11px 15px;
  background:var(--frame);color:white;font-size:15px;cursor:pointer
}
button:hover{background:var(--dark)}
button:disabled{opacity:.4;cursor:not-allowed}
.panel{max-width:700px;margin:12px auto;padding:12px;background:#fff9;border-radius:8px}
#moves{font-size:14px;line-height:1.8}
small{display:block;margin-top:12px;color:#66594d}
@media(max-width:560px){
  body{padding:5px}
  .game-layout{gap:5px;width:100%}
  .board{padding:4px;gap:3px;border-width:2px}
  .half{padding:3px;gap:2px}
  .quarters{gap:4px}
  .bar{min-width:23px;width:9%;padding:3px 1px}
  .bar .checker{width:90%;min-width:14px;border-width:1px}
  .bar-label{font-size:8px}
  .bar-count{font-size:9px}
  .tray{min-width:12px;width:6%;font-size:8px}
  .checker{border-width:1px}
  .dice-panel{width:62px;padding:6px 3px;gap:8px}
  .dice-title{font-size:10px}
  .die{width:39px;height:39px;font-size:29px;border-radius:7px}
  button{padding:9px;font-size:13px}
}
@media(prefers-reduced-motion:reduce){
  #status.white-turn,#status.black-turn,.die.rolling{animation:none}
}
</style>
</head>
<body>

<h1>🎲 Mon Coach de Jeux IA</h1>
<div id="status" class="white-turn">⚪ Tour des Blancs</div>
<div id="help">Lancez les dés pour commencer.</div>

<div class="game-layout">
  <div class="board">
    <div class="half">
      <div class="tray"><span>BLANC</span><span id="offW">0</span></div>
      <div class="quarters">
        <div class="row top" data-points="13,14,15,16,17,18"></div>
        <div class="row bottom" data-points="12,11,10,9,8,7"></div>
      </div>
    </div>
    <div class="bar" id="bar"></div>
    <div class="half">
      <div class="quarters">
        <div class="row top" data-points="19,20,21,22,23,24"></div>
        <div class="row bottom" data-points="6,5,4,3,2,1"></div>
      </div>
      <div class="tray"><span>NOIRS</span><span id="offB">0</span></div>
    </div>
  </div>

  <aside class="dice-panel" id="dicePanel">
    <div class="dice-title">🎲 LES DÉS</div>
    <div class="dice-pair">
      <div class="die" id="die1">⚀</div>
      <div class="die" id="die2">⚄</div>
    </div>
    <div id="diceResult" style="font-size:12px;font-weight:bold">Prêts !</div>
  </aside>
</div>

<div class="controls">
  <button id="roll">🎲 Lancer les dés</button>
  <button id="pass" disabled>Terminer le tour</button>
  <button id="reset">Nouvelle partie</button>
  <button id="sound">🔊 Son activé</button>
</div>

<div class="panel">
  <strong>Coups possibles</strong>
  <div id="moves">Aucun coup joué.</div>
</div>
<small>Jeu local à deux joueurs — les Blancs avancent des cases 24 vers 1, les Noirs des cases 1 vers 24.</small>

<script>
(()=>{
'use strict';

const START={
  24:['white',2],13:['white',5],8:['white',3],6:['white',5],
  1:['black',2],12:['black',5],17:['black',3],19:['black',5]
};
let state={},bar={white:0,black:0},off={white:0,black:0};
let turn='white',dice=[],selected=null,rolled=false,over=false,history=[];
let soundEnabled=true,audioContext=null,rollToken=0;

const $=id=>document.getElementById(id);
const opponent=c=>c==='white'?'black':'white';
const label=c=>c==='white'?'Blancs':'Noirs';

document.querySelectorAll('.row').forEach(row=>{
  row.dataset.points.split(',').forEach(n=>{
    const p=document.createElement('div');
    p.className='point';p.dataset.n=n;
    p.innerHTML='<div class="tri"></div><span class="num">'+n+'</span>';
    p.addEventListener('click',()=>clickPoint(Number(n)));
    row.appendChild(p);
  });
});

$('bar').innerHTML=
  '<div id="barW" role="button" tabindex="0" aria-label="Pions blancs sur la barre"></div>'+
  '<div class="bar-label">BARRE</div>'+
  '<div id="barB" role="button" tabindex="0" aria-label="Pions noirs sur la barre"></div>';

['barW','barB'].forEach(id=>{
  $(id).addEventListener('click',e=>{e.stopPropagation();clickPoint(0)});
  $(id).addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault();clickPoint(0)}
  });
});

function playSound(){
  if(!soundEnabled)return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    if(!audioContext)audioContext=new C();
    if(audioContext.state==='suspended')audioContext.resume();
    const now=audioContext.currentTime;

    // Petits claquements irréguliers évoquant des dés qui roulent.
    for(let i=0;i<8;i++){
      const start=now+i*.075;
      const duration=.035+Math.random()*.035;
      const buffer=audioContext.createBuffer(1,Math.floor(audioContext.sampleRate*duration),audioContext.sampleRate);
      const data=buffer.getChannelData(0);
      for(let j=0;j<data.length;j++){
        data[j]=(Math.random()*2-1)*(1-j/data.length);
      }
      const source=audioContext.createBufferSource();
      const gain=audioContext.createGain();
      const filter=audioContext.createBiquadFilter();
      filter.type='highpass';filter.frequency.value=650;
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(.18,start+.005);
      gain.gain.exponentialRampToValueAtTime(.0001,start+duration);
      source.buffer=buffer;
      source.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
      source.start(start);source.stop(start+duration);
    }
  }catch(e){
    // Le jeu continue même si le navigateur ne permet pas le son.
  }
}

function snapshot(){
  return {state:JSON.parse(JSON.stringify(state)),bar:{...bar},off:{...off},
    turn,dice:[...dice],rolled,over};
}
function save(){history.push(JSON.stringify(snapshot()))}
function allHome(color){
  if(bar[color]>0)return false;
  for(let n=1;n<=24;n++){
    if(state[n]?.color===color){
      if(color==='white'&&n>6)return false;
      if(color==='black'&&n<19)return false;
    }
  }
  return true;
}
function legalTargets(from){
  if(!rolled||over)return [];
  if(bar[turn]>0&&from!==0)return [];
  const result=[];
  for(const die of [...new Set(dice)]){
    let to=from===0?(turn==='white'?25-die:die):
      (turn==='white'?from-die:from+die);
    if(to>=1&&to<=24){
      const dest=state[to];
      if(!dest||dest.color===turn||dest.count===1)result.push({to,die});
    }else if(from!==0&&allHome(turn)){
      const exact=turn==='white'?from===die:25-from===die;
      const overshoot=turn==='white'?from<die:25-from<die;
      let blocked=false;
      if(overshoot){
        for(let n=turn==='white'?from+1:19;
            n<=(turn==='white'?6:from-1);n++){
          if(state[n]?.color===turn){blocked=true;break}
        }
      }
      if(exact||(overshoot&&!blocked))result.push({to:25,die});
    }
  }
  return result;
}
function availableSources(){
  if(!rolled||over)return [];
  if(bar[turn]>0)return legalTargets(0).length?[0]:[];
  const sources=[];
  for(let n=1;n<=24;n++){
    if(state[n]?.color===turn&&legalTargets(n).length)sources.push(n);
  }
  return sources;
}
function canUseDice(){return dice.length>0&&availableSources().length>0}

function applyMove(from,to){
  if(from===0)bar[turn]--;
  else{
    state[from].count--;
    if(state[from].count===0)delete state[from];
  }
  if(to===25){off[turn]++;return}
  if(state[to]?.color===opponent(turn)){
    delete state[to];bar[opponent(turn)]++;
  }
  if(!state[to])state[to]={color:turn,count:0};
  state[to].count++;
}

function clickPoint(n){
  if(over||!rolled)return;
  if(selected===null){
    if(n===0&&bar[turn]>0&&availableSources().includes(0)){
      selected=0;render();return;
    }
    if(availableSources().includes(n)){selected=n;render()}
    return;
  }
  if(n!==0&&availableSources().includes(n)){
    selected=n;render();return;
  }
  const opt=legalTargets(selected).find(x=>x.to===n);
  if(!opt)return;
  save();applyMove(selected,n);
  const i=dice.indexOf(opt.die);
  if(i>=0)dice.splice(i,1);
  selected=null;
  if(off[turn]===15){over=true;render();return}
  if(!canUseDice()){finishTurn();return}
  render();
}

function render(){
  document.querySelectorAll('.point').forEach(p=>{
    const n=Number(p.dataset.n),s=state[n];
    p.querySelectorAll('.checker').forEach(c=>c.remove());
    p.classList.toggle('selected',selected===n);
    p.classList.toggle('legal',selected!==null&&legalTargets(selected).some(x=>x.to===n));
    if(s)for(let i=0;i<s.count;i++){
      const c=document.createElement('div');
      c.className='checker '+s.color;p.appendChild(c);
    }
  });

  $('barW').innerHTML='';$('barB').innerHTML='';
  for(const c of ['white','black']){
    const target=$(c==='white'?'barW':'barB');
    target.classList.toggle('selected',selected===0&&turn===c);
    if(bar[c]>0){
      const checker=document.createElement('div');
      checker.className='checker '+c;
      target.appendChild(checker);
      const count=document.createElement('span');
      count.className='bar-count';count.textContent='× '+bar[c];
      target.appendChild(count);
    }else{
      const empty=document.createElement('span');
      empty.className='bar-count';empty.textContent='—';empty.style.opacity='.3';
      target.appendChild(empty);
    }
  }

  $('offW').textContent=off.white;$('offB').textContent=off.black;
  $('status').className=over?'finished':turn==='white'?'white-turn':'black-turn';
  $('status').textContent=over?'🏆 '+label(turn)+' gagnent !':
    (turn==='white'?'⚪':'⚫')+' Tour des '+label(turn);
  $('help').textContent=over?'Partie terminée. Cliquez sur Nouvelle partie pour rejouer.':
    !rolled?'Lancez les dés pour commencer.':
    bar[turn]>0?'Vous avez un pion sur la barre : sélectionnez-le, puis choisissez une entrée autorisée.':
    'Sélectionnez un pion, puis une destination autorisée.';
  $('roll').disabled=rolled||over;
  $('pass').disabled=!rolled||over;
  $('moves').textContent=rolled?'Dés restants : '+(dice.join(', ')||'aucun'):
    'Lancez les dés pour afficher les coups possibles.';
}

function finishTurn(){
  selected=null;rolled=false;dice=[];
  turn=opponent(turn);
  $('diceResult').textContent='À vous de jouer !';
  render();
}

function rollDice(){
  if(rolled||over)return;
  if(audioContext?.state==='suspended')audioContext.resume();
  rolled=true;selected=null;
  const token=++rollToken;
  const dieEls=[$('die1'),$('die2')];
  $('dicePanel').classList.add('rolling');
  dieEls.forEach(el=>el.classList.add('rolling'));
  $('diceResult').textContent='Ça roule…';
  playSound();
  render();

  const finalA=1+Math.floor(Math.random()*6);
  const finalB=1+Math.floor(Math.random()*6);
  const faces=['⚀','⚁','⚂','⚃','⚄','⚅'];
  let ticks=0;
  const interval=window.setInterval(()=>{
    if(token!==rollToken){clearInterval(interval);return}
    dieEls[0].textContent=faces[Math.floor(Math.random()*6)];
    dieEls[1].textContent=faces[Math.floor(Math.random()*6)];
    ticks++;
    if(ticks>=12){
      clearInterval(interval);
      dieEls[0].classList.remove('rolling');
      dieEls[1].classList.remove('rolling');
      $('dicePanel').classList.remove('rolling');
      dieEls[0].textContent=faces[finalA-1];
      dieEls[1].textContent=faces[finalB-1];
      $('diceResult').textContent=finalA+' + '+finalB;
      dice=finalA===finalB?[finalA,finalA,finalA,finalA]:[finalA,finalB];

      if(!canUseDice()){
        render();
        $('help').textContent='Aucun coup légal : le tour va passer.';
        window.setTimeout(()=>{
          if(token===rollToken&&rolled&&!over&&!canUseDice())finishTurn();
        },1000);
      }else render();
    }
  },75);
}

function reset(){
  rollToken++;
  state={};
  for(const n in START)state[n]={color:START[n][0],count:START[n][1]};
  bar={white:0,black:0};off={white:0,black:0};
  turn='white';dice=[];selected=null;rolled=false;over=false;history=[];
  $('die1').textContent='⚀';$('die2').textContent='⚄';
  $('diceResult').textContent='Prêts !';
  $('dicePanel').classList.remove('rolling');
  document.querySelectorAll('.die').forEach(el=>el.classList.remove('rolling'));
  render();
}

$('roll').addEventListener('click',rollDice);
$('pass').addEventListener('click',()=>{
  if(!rolled||over)return;
  if(canUseDice()){
    $('help').textContent='Vous avez encore un coup légal à jouer.';
    return;
  }
  save();finishTurn();
});
$('reset').addEventListener('click',reset);
$('sound').addEventListener('click',()=>{
  soundEnabled=!soundEnabled;
  $('sound').textContent=soundEnabled?'🔊 Son activé':'🔇 Son désactivé';
  if(soundEnabled)playSound();
});

reset();
})();
</script>
</body>
</html>
