<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plateau de backgammon</title>
<style>
  :root {
    --frame: #4a3426;      /* bois du cadre */
    --frame-dark: #35241a;
    --field: #b86f45;      /* fond marron du plateau */
    --cream: #f6efe2;      /* triangles crème */
    --brown: #2b1d17;      /* triangles marron foncé */
    --tray: #7a5238;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #ece7df;
    padding: 20px;
  }

  /* Cadre extérieur */
  .board {
    display: flex;
    width: min(96vw, 1000px);
    aspect-ratio: 1.45 / 1;
    padding: 2.2%;
    background: linear-gradient(135deg, var(--frame), var(--frame-dark));
    border-radius: 6px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .35);
    gap: 1.2%;
  }

  /* Une moitié du plateau */
  .half {
    flex: 1;
    display: flex;
    gap: 3%;
    padding: 2.5%;
    background: var(--field);
    background-image:
      radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,.08) 1px, transparent 1px);
    background-size: 5px 5px, 7px 7px;
    border-radius: 3px;
    box-shadow: inset 0 0 0 4px var(--frame-dark), inset 0 0 18px rgba(0,0,0,.45);
    position: relative;
  }

  /* Petit rail de stockage des pions, côté extérieur */
  .tray {
    width: 7%;
    background: var(--tray);
    border-radius: 2px;
    box-shadow: inset 0 0 8px rgba(0,0,0,.5);
  }

  .quarters {
    flex: 1;
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 6%;
  }

  /* Une rangée de 6 triangles */
  .row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0;
  }

  .point {
    background: var(--cream);
  }
  .row.top .point {
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    margin: 0 1.5%;
  }
  .row.bottom .point {
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    margin: 0 1.5%;
  }

  /* Alternance crème / marron */
  .row.top .point:nth-child(even)    { background: var(--brown); }
  .row.bottom .point:nth-child(odd)  { background: var(--brown); }
  .row.bottom .point:nth-child(even) { background: var(--cream); }

  /* La barre centrale (charnière) */
  .bar {
    width: 1.2%;
    background: var(--frame-dark);
    border-radius: 1px;
  }

  /* Moitié droite : le rail est à droite */
  .half.right { flex-direction: row-reverse; }
</style>
</head>
<body>

  <div class="board" id="board">
    <div class="half left">
      <div class="tray"></div>
      <div class="quarters">
        <div class="row top"></div>
        <div class="row bottom"></div>
      </div>
    </div>

    <div class="bar"></div>

    <div class="half right">
      <div class="tray"></div>
      <div class="quarters">
        <div class="row top"></div>
        <div class="row bottom"></div>
      </div>
    </div>
  </div>

  <script>
    // Génère les 6 triangles de chaque rangée (24 au total)
    document.querySelectorAll('.row').forEach(function (row) {
      for (var i = 0; i < 6; i++) {
        var p = document.createElement('div');
        p.className = 'point';
        row.appendChild(p);
      }
    });
  </script>

</body>
</html>
